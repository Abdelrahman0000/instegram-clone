name: Restore verified Supabase clone source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: github.ref == 'refs/heads/main' && github.actor == 'Abdelrahman0000'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify package and restore source
        shell: python
        run: |
          import base64, hashlib, pathlib, shutil, subprocess, tempfile, zipfile
          root = pathlib.Path.cwd()
          parts = sorted((root / 'release').rglob('source-*.b64'))
          assert len(parts) == 16, 'Expected all 16 package segments'
          data = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          assert hashlib.sha256(data).hexdigest() == '8acc094ec6de990bf50642b159dac230693803835f8a1bec3b692211c4f5b8ff', 'Package checksum mismatch'
          with tempfile.TemporaryDirectory() as temporary:
              temporary = pathlib.Path(temporary)
              archive = temporary / 'source.zip'
              archive.write_bytes(data)
              with zipfile.ZipFile(archive) as package:
                  for item in package.infolist():
                      path = pathlib.PurePosixPath(item.filename)
                      assert not path.is_absolute() and '..' not in path.parts
                      assert path.parts[0] == 'instagram-clone'
                  package.extractall(temporary / 'unpacked')
              tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
              for name in filter(None, tracked):
                  path = pathlib.Path(name)
                  if path.parts[:2] == ('.github', 'workflows'):
                      continue
                  if path.is_file() or path.is_symlink():
                      path.unlink()
              shutil.copytree(temporary / 'unpacked' / 'instagram-clone', root, dirs_exist_ok=True)
      - name: Verify source tests
        run: |
          npm ci
          npm test
          npm run build
      - name: Publish restored source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Supabase Instagram clone source and media'
            git push origin HEAD:main
          fi
